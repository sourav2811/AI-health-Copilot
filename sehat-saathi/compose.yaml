services:
  health-copilot:
    build: .
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATA_DIR: /data
      OPENAI_MODEL: gpt-4.1-mini
    env_file:
      - path: ../.env.local
        required: false
    volumes:
      - health-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
volumes:
  health-data:
